<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produce MD 시야 대시보드 W31 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;
  --accent:#16a34a;--up:#16a34a;--down:#dc2626;--warn:#d97706;
  --text:#0f172a;--dim:#475569;--muted:#94a3b8;
  --shadow:0 1px 4px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);}

/* HEADER */
header{background:#fff;border-bottom:3px solid var(--accent);padding:16px 36px;display:flex;align-items:center;justify-content:space-between;}
.hd-left h1{font-size:20px;font-weight:900;letter-spacing:-0.5px;}
.hd-left p{font-size:11px;color:var(--muted);margin-top:3px;}
.hd-right{display:flex;align-items:center;gap:10px;}
.badge{background:var(--accent);color:#fff;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;}
.logo{font-size:16px;font-weight:900;} .logo span{color:var(--accent);}

/* TWO-LEVEL NAV */
.nav-l1{background:#fff;border-bottom:2px solid var(--border);padding:0 36px;display:flex;overflow-x:auto;}
.nav-l1::-webkit-scrollbar{height:2px;}
.tab1{padding:11px 16px;border:none;background:transparent;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;transition:all 0.12s;}
.tab1:hover{color:var(--dim);}
.tab1.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}
.tab1-yoy{font-family:'DM Mono',monospace;font-size:10px;margin-left:4px;}
.tab1.active .up{color:var(--up);} .tab1.active .down{color:var(--down);}

.nav-l2{background:#f8fafc;border-bottom:1px solid var(--border);padding:6px 36px;display:flex;gap:4px;flex-wrap:wrap;}
.tab2{padding:7px 14px;border:1px solid transparent;background:transparent;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;color:var(--muted);border-radius:6px;transition:all 0.12s;}
.tab2:hover{background:#e2e8f0;color:var(--dim);}
.tab2.active{background:#fff;color:var(--accent);border-color:var(--border);font-weight:700;}
.adot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ef4444;margin-left:4px;vertical-align:middle;}

/* MAIN */
main{padding:20px 36px;max-width:1460px;margin:0 auto;}

/* ALERT BANNER */
.abanner{background:linear-gradient(135deg,#fef2f2,#fff7ed);border:1px solid #fca5a5;border-radius:10px;padding:12px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.abanner h3{font-size:13px;font-weight:700;color:#991b1b;}
.abanner p{font-size:12px;color:#7f1d1d;margin-top:2px;}

/* 3W TREND STRIP */
.tstrip{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 20px;margin-bottom:16px;display:flex;align-items:stretch;gap:0;}
.ts-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding-right:18px;display:flex;align-items:center;}
.ts-wk{flex:1;text-align:center;padding:0 10px;border-left:1px solid var(--border);}
.ts-w{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);font-weight:700;}
.ts-per{font-size:10px;color:var(--muted);}
.ts-amt{font-family:'DM Mono',monospace;font-size:14px;font-weight:700;margin-top:3px;}
.ts-yoy{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;margin-top:2px;}
.ts-wow{font-size:10px;color:var(--muted);margin-top:1px;}
.ts-arr{padding-left:18px;border-left:1px solid var(--border);display:flex;align-items:center;font-size:26px;font-weight:900;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);}
.kpi-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;margin-bottom:5px;}
.kpi-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:700;line-height:1;}
.kpi-d{font-family:'DM Mono',monospace;font-size:12px;font-weight:600;margin-top:4px;}
.kpi-d.up{color:var(--up);} .kpi-d.down{color:var(--down);}
.kpi-s{font-size:10px;color:var(--muted);margin-top:2px;}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
.full{grid-column:1/-1;}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
.card-hd{padding:12px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:700;}
.card-hint{font-size:11px;color:var(--muted);}

/* TABLES */
.tbl-scroll{overflow-y:auto;overflow-x:auto;}
.tbl-scroll::-webkit-scrollbar{width:3px;height:3px;}
.tbl-scroll::-webkit-scrollbar-thumb{background:var(--border);}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;padding:8px 10px;background:#f8fafc;border-bottom:1px solid var(--border);text-align:left;position:sticky;top:0;z-index:1;white-space:nowrap;}
.tbl th.r{text-align:right;} .tbl th.c{text-align:center;}
.tbl tbody tr{border-bottom:1px solid #f1f5f9;}
.tbl tbody tr:hover{background:#f8fafc;}
.tbl td{padding:7px 10px;font-size:11px;vertical-align:middle;}
.mono{font-family:'DM Mono',monospace;text-align:right;white-space:nowrap;font-size:11px;}
.cen{text-align:center;}
.up{color:var(--up);font-weight:600;} .dn{color:var(--down);font-weight:600;}

/* YoY BADGE */
.yoy{display:inline-block;padding:2px 6px;border-radius:3px;font-family:'DM Mono',monospace;font-size:10px;font-weight:700;white-space:nowrap;}
.yh{background:#dcfce7;color:#15803d;}
.ym{background:#f0fdf4;color:#16a34a;}
.yn{background:#f8fafc;color:#94a3b8;}
.yw{background:#fef9c3;color:#92400e;}
.yd{background:#fee2e2;color:#991b1b;}

/* CAT BARS */
.catlist{padding:10px 14px;}
.catrow{margin-bottom:9px;}
.catrow-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.catname{font-size:11px;font-weight:500;color:var(--dim);display:flex;align-items:center;gap:5px;}
.catdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.catvals{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);display:flex;gap:7px;align-items:center;}
.catp{color:var(--accent);font-weight:700;}
.barwrap{height:4px;border-radius:2px;background:#f1f5f9;position:relative;}
.bar25{position:absolute;top:0;left:0;height:100%;border-radius:2px;background:#cbd5e1;}
.bar26{position:absolute;top:0;left:0;height:100%;border-radius:2px;opacity:0.85;}

/* PLU BADGE */
.plu{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);background:#f1f5f9;padding:1px 5px;border-radius:3px;font-weight:600;}

/* CAT PILL */
.cp{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;}

/* ALERT CARDS */
.ac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:12px 14px;}
.ac{border-radius:8px;padding:12px;border:1px solid;}
.ac.high{background:#fef2f2;border-color:#fca5a5;}
.ac.medium{background:#fffbeb;border-color:#fde68a;}
.ac-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.ac-name{font-size:14px;font-weight:800;}
.ac-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.ac-sev{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;}
.ac-sev.high{background:#ef4444;color:#fff;} .ac-sev.medium{background:#f59e0b;color:#fff;}
.ac-sigs{display:flex;gap:4px;margin-bottom:7px;flex-wrap:wrap;}
.acsig{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:700;background:#fee2e2;color:#991b1b;}
.acsig.wow{background:#fef3c7;color:#92400e;}
.ac-weeks{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.acw{background:#fff;border-radius:5px;padding:5px 6px;text-align:center;border:1px solid #e5e7eb;}
.acw-lbl{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;}
.acw-yoy{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;margin-top:1px;}
.acw-amt{font-size:9px;color:var(--muted);}

/* CAT TREND MATRIX */
.matrix-wrap{overflow-x:auto;}
.mxheat{border-collapse:collapse;width:100%;}
.mxheat th{font-size:9px;color:var(--muted);padding:6px 8px;background:#f8fafc;border:1px solid var(--border);text-align:center;font-weight:700;white-space:nowrap;}
.mxheat td{font-size:10px;padding:5px 7px;border:1px solid #e2e8f0;text-align:center;font-family:'DM Mono',monospace;font-weight:600;}

/* PRICE TABLE */
.ptag{font-size:11px;font-weight:700;}
.ptag.up{color:#dc2626;} .ptag.dn{color:#16a34a;}

@media(max-width:900px){
  header,.nav-l1,.nav-l2,main{padding-left:14px;padding-right:14px;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .g2,.g3{grid-template-columns:1fr;}
  .tstrip{flex-direction:column;gap:10px;}
}
</style>
</head>

</nav>

function fA(v){return'$'+(Math.abs(v||0)).toLocaleString('en-US',{maximumFractionDigits:0});}
function fC(v){return(v>=0?'+':'-')+'$'+(Math.abs(v||0)).toLocaleString('en-US',{maximumFractionDigits:0});}
function fP(v){return(v>=0?'+':'')+v.toFixed(1)+'%';}
function fP2(v){return(Math.abs(v||0)).toFixed(1)+'%';}
function yc(v){return v>=10?'yh':v>=3?'ym':v>=-3?'yn':v>=-10?'yw':'yd';}
function yB(v){return`<span class="yoy ${yc(v)}">${fP(v)}</span>`;}
function arr(ys){const l=ys[ys.length-1],p=ys[ys.length-2];return l>p+1?'↑':l<p-1?'↓':'→';}
function cpSty(cat){const c=CC[cat]||'#94a3b8';return`class="cp" style="background:${c}22;color:${c};border:1px solid ${c}44"`;}

function setRegion(r){

}

}

// ── 공통 헤더 (3주 추이 스트립) ─────────────────────────
function gpFor(wk){
  const src = curR==='전국' ? GP.national[wk] : (GP.regions[curR]||{})[wk];
  return src || {sales:0,purchase:0,gp:0,gp_pct:null};
}
function skuInfo(){
  return curR==='전국' ? GP.sku_national : (GP.sku_region[curR]||{total_distinct:0,avg_per_store:0});
}
function buildStrip(d){
  const t=d.trend||{};
  const amts=WEEKS.map(w=>t[w]?.amt26||0);
  const yoys=WEEKS.map(w=>t[w]?.yoy||0);
  const arrow=arr(yoys);
  const ac=arrow==='↑'?'var(--up)':arrow==='↓'?'var(--down)':'#94a3b8';
  let h=`<div class="tstrip"><div class="ts-lbl">4주 추이<br><span style="font-size:9px;color:var(--muted);font-weight:400">(${NW}은 GP%·SKU 포함)</span></div>`;
  WEEKS.forEach((wk,i)=>{
    const r=t[wk]||{};
    const wow=i>0&&amts[i-1]>0?+((amts[i]-amts[i-1])/amts[i-1]*100).toFixed(1):null;
    const g=gpFor(wk);
    h+=`<div class="ts-wk">
      <div class="ts-w">${wk}</div><div class="ts-per">${WP[wk]}</div>
      <div class="ts-amt">${fA(r.amt26||0)}</div>
      <div class="ts-yoy" style="color:${(r.yoy||0)>=0?'var(--up)':'var(--down)'}">${fP(r.yoy||0)} YoY</div>
      ${wow!==null?`<div class="ts-wow">WoW ${fP(wow)}</div>`:''}
      ${g.gp_pct!==null?`<div class="ts-gp" style="font-size:11px;margin-top:3px;color:#7c3aed;font-weight:700">GP% ${g.gp_pct}%${g.verified?' ✅':''}</div>`:''}
    </div>`;
  });
  const g26=gpFor(NW); const sku=skuInfo(); const _showNW=!WEEKS.includes(NW);
  const amt25=amts[amts.length-1], wow26=amt25>0?+((g26.sales-amt25)/amt25*100).toFixed(1):null;
  if(_showNW) h+=`<div class="ts-wk" style="border-left:2px dashed #c4b5fd;background:#faf5ff">
    <div class="ts-w" style="color:#7c3aed">${NW}</div><div class="ts-per">${GP.week_period||''}</div>
    <div class="ts-amt">${fA(g26.sales||0)}</div>
    ${wow26!==null?`<div class="ts-wow">WoW ${fP(wow26)}</div>`:''}
    ${g26.gp_pct!==null?`<div class="ts-gp" style="font-size:11px;margin-top:3px;color:#7c3aed;font-weight:700">GP% ${g26.gp_pct}%${g26.verified?' ✅실측':''}</div>`:''}
    <div style="font-size:10.5px;color:var(--muted);margin-top:2px">SKU 평균 ${sku.avg_per_store?sku.avg_per_store.toLocaleString():'-'}/매장</div>
  </div>`;
  h+=`<div class="ts-arr" style="color:${ac}">${arrow}</div></div>`;
  return h;
}

// ── 공통 Alert 배너 ────────────────────────────────────
function buildAlertBanner(d){
  const highN=Object.values(AL).filter(a=>a.severity==='high'&&(curR==='전국'||a.region===curR)).length;
  const medN =Object.values(AL).filter(a=>a.severity==='medium'&&(curR==='전국'||a.region===curR)).length;
  const gpBrs=Object.entries(GP.alerts).filter(([br])=>{
    const region=(M.branches[br]||{}).region;
    return curR==='전국'||region===curR;
  });
  let h='';
  if(highN>0||medN>0){
    h+=`<div class="abanner"><span style="font-size:22px">🚨</span>
      <div><h3>매출 이상 징후 — ${curR==='전국'?'전국':curR} : HIGH ${highN}개 · MED ${medN}개 매장</h3>
      <p>최근 3주(${WEEKS.join("-")}) 중 2주 연속 YoY -5% 이하 하락 매장. "매장별 현황" 탭에서 클릭하면 상세 확인.</p></div></div>`;
  }
  if(gpBrs.length>0){
    h+=`<div class="abanner" style="background:#f5f3ff;border-color:#c4b5fd">
      <span style="font-size:22px">📉</span>
      <div><h3 style="color:#6d28d9">GP% 이상 징후 — ${curR==='전국'?'전국':curR} : ${gpBrs.length}개 매장</h3>

  }
  return h;
}

  h+='<div class="g2">';

  // TOP 상품 — $ 임팩트 기준 (성장 TOP5 / 부진 TOP5)
  const rankedItems=(d.topItems||[]).map(it=>({...it, chg:(it.amt26||0)-(it.amt25||0)}));

        <tbody>${topDecline.map(it=>rowHtml(it,'dn')).join('')}</tbody></table>
      </div>
    </div></div>`;

  // 전국: 지역 비교 + 권역 합산
  if(curR==='전국'){
    h+=`<div class="g2">`;
    // 지역 비교
    h+=`<div class="card"><div class="card-hd"><span class="card-title">🗺️ 지역별 ${NW} 비교</span><span class="card-hint">3주 추세 포함</span></div>
    <div class="tbl-scroll"><table class="tbl"><thead><tr>
      <th>#</th><th>지역</th><th class="r">W27 2026</th><th class="r">W27 2025</th>
      <th class="c">YoY</th><th class="c">W27</th><th class="c">W26</th><th class="c">추세</th>
    </tr></thead><tbody>`;
    REGIONS.filter(r=>M.regions[r]).sort((a,b)=>M.regions[b].total26-M.regions[a].total26).forEach((r,i)=>{
      const rd=M.regions[r], tr=rd.trend||{};
      const yoys=WEEKS.map(w=>tr[w]?.yoy||0);
      const aH=Object.values(AL).some(a=>a.region===r&&a.severity==='high');
      h+=`<tr style="${aH?'background:#fef2f2':''}">
        <td style="color:var(--muted);font-family:'DM Mono',monospace">${i+1}</td>
        <td><strong>${r}</strong>${aH?' 🚨':''}</td>
        <td class="mono">${fA(rd.total26)}</td>
        <td class="mono" style="color:var(--muted)">${fA(rd.total25)}</td>
        <td class="cen">${yB(rd.yoy)}</td>
        <td class="cen">${yB(yoys[0])}</td><td class="cen">${yB(yoys[1])}</td>
        <td class="cen" style="font-size:18px">${arr(yoys)}</td>
      </tr>`;
    });
    h+=`</tbody></table></div></div>`;
    // 권역 합산
    const zones={};
    REGIONS.forEach(r=>{const z=ZONES[r]||'기타',rd=M.regions[r];if(!zones[z])zones[z]={a26:0,a25:0};if(rd){zones[z].a26+=rd.total26;zones[z].a25+=rd.total25;}});
    h+=`<div class="card"><div class="card-hd"><span class="card-title">🌐 권역별 합산</span></div>
    <table class="tbl"><thead><tr><th>권역</th><th class="r">2026 ${NW}</th><th class="r">2025 ${NW}</th><th class="c">YoY</th></tr></thead><tbody>`;
    Object.entries(zones).sort((a,b)=>b[1].a26-a[1].a26).forEach(([z,v])=>{
      const yoy=v.a25>0?+((v.a26-v.a25)/v.a25*100).toFixed(1):0;
      h+=`<tr><td><strong>${z}</strong></td><td class="mono">${fA(v.a26)}</td><td class="mono" style="color:var(--muted)">${fA(v.a25)}</td><td class="cen">${yB(yoy)}</td></tr>`;
    });
    h+=`</tbody></table></div></div>`;
  }
  return h;
}

// ════════════════════════════════════════════
// VIEW 2: 카테고리 추이 분석
// ════════════════════════════════════════════
function renderCategory(d){
  const lbl=curR==='전국'?'전국':curR;

  let selH='';
  if(curR!=='전국'){
    const brs=(d.byBranch||[]).map(b=>b.br);
    selH=`<div class="card" style="margin-bottom:14px"><div style="padding:12px 14px;display:flex;align-items:center;gap:10px">
      <span style="font-size:12.5px;color:var(--muted);font-weight:600">보기 단위</span>
      <select id="catBrSel" onchange="catSelBr=this.value;render()" style="padding:6px 10px;border-radius:6px;border:1px solid #ddd;font-size:13px">
        <option value="" ${!catSelBr?'selected':''}>지역 평균 (${curR} 전체)</option>
        ${brs.map(br=>`<option value="${br}" ${catSelBr===br?'selected':''}>${br} 매장만</option>`).join('')}
      </select>
      ${catSelBr&&!DX.branch_detail[catSelBr]?`<span style="font-size:11.5px;color:#c2410c">⚠️ 이 매장은 ${NW} 카테고리 구성만 제공됩니다 (과거 주차 매장별 데이터 미보유)</span>`:''}
    </div></div>`;
  }

  if(catSelBr && !DX.branch_detail[catSelBr]){
    const cd=(GP.cat26_tx&&GP.cat26_tx[catSelBr])||{byCat:[],total:0};
    let h=selH+`<div class="card"><div class="card-hd">
      <span class="card-title">🏷️ ${catSelBr} 카테고리 구성 (${NW})</span><span class="card-hint">매출 기준</span></div>
      <div class="tbl-scroll" style="max-height:480px"><table class="tbl"><thead><tr>
      <th>카테고리</th><th class="r">매출(${NW})</th><th class="r">비중</th></tr></thead><tbody>`;
    cd.byCat.forEach(c=>{
      const col=CC[c.cat]||'#94a3b8';
      h+=`<tr><td><span class="cp" style="background:${col}22;color:${col};border:1px solid ${col}44">${c.cat}</span></td>
        <td class="mono r">${fA(c.amt)}</td><td class="mono r">${c.pct}%</td></tr>`;
    });
    h+=`</tbody></table></div></div>`;
    return h;
  }

  const natCT=DX.nat_cat_trend||{};
  const regCT=catSelBr&&DX.branch_detail[catSelBr] ? (DX.branch_detail[catSelBr].cat_3w||{}) : ((DX.region_cat_trend||{})[curR]||{});
  const ctData=curR==='전국'?natCT:regCT;
  const dCat = catSelBr&&DX.branch_detail[catSelBr] ? DX.branch_detail[catSelBr].byCat : d.byCat;
  const titleLbl = catSelBr ? `${catSelBr} 매장` : lbl;

  const allCats=[...(dCat||[])].filter(c=>c.amt26>0).map(c=>c.cat);

  // W28 카테고리별 YoY 바 차트 — 한눈에 순위 비교, hover 시 상세 수치
  const barCats=[...(dCat||[])].filter(c=>c.amt26>0).sort((a,b)=>(b.yoy||0)-(a.yoy||0));
  const maxAbsYoy=Math.max(1,...barCats.map(c=>Math.abs(c.yoy||0)));
  const barChart=`<div class="card" style="margin-bottom:14px"><div class="card-hd">
    <span class="card-title">📊 ${NW} 카테고리별 YoY — ${titleLbl}</span>
    <span class="card-hint">막대에 마우스를 올리면 $금액·YoY% 표시 · YoY% 내림차순</span></div>
    <div style="padding:14px 16px">
      ${barCats.map(c=>{
        const col=CC[c.cat]||'#94a3b8';
        const w=Math.abs(c.yoy||0)/maxAbsYoy*100;
        const isUp=(c.yoy||0)>=0;
        return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px" title="${c.cat} — ${fA(c.amt26)} (YoY ${fP(c.yoy||0)}, ${fC((c.amt26||0)-(c.amt25||0))})">
          <div style="width:130px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.cat}</div>
          <div style="flex:1;height:14px;background:#f1f5f9;border-radius:3px;position:relative">
            <div style="position:absolute;top:0;left:0;height:100%;border-radius:3px;width:${w}%;background:${isUp?col:'#f87171'}"></div>
          </div>
          <div style="width:60px;text-align:right;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:${isUp?'var(--up)':'var(--down)'}">${fP(c.yoy||0)}</div>
        </div>`;
      }).join('')}
    </div></div>`;

  let h=selH+barChart+`<div class="card" style="margin-bottom:14px"><div class="card-hd">
    <span class="card-title">🏷️ 카테고리 × 3주 YoY 히트맵 — ${titleLbl}</span>
    <span class="card-hint">컬러: 빨간=부진, 초록=성장</span></div>
    <div class="matrix-wrap"><table class="mxheat"><thead><tr>
      <th style="text-align:left;min-width:160px">카테고리</th>
      ${WEEKS.map(w=>`<th>${w} 매출</th><th>${w} YoY</th>`).join('')}
      <th>3주 추세</th>
    </tr></thead><tbody>`;

  allCats.forEach(cat=>{
    const col=CC[cat]||'#94a3b8';
    const wdata=WEEKS.map(w=>(ctData[w]||{})[cat]||{amt26:0,yoy:0});
    const yoys=wdata.map(w=>w.yoy||0);
    h+=`<tr>
      <td style="text-align:left"><span class="cp" style="background:${col}22;color:${col};border:1px solid ${col}44">${cat}</span></td>
      ${wdata.map(w=>`<td class="mono">${fA(w.amt26||0)}</td><td class="cen">${yB(w.yoy||0)}</td>`).join('')}
      <td class="cen" style="font-size:16px">${arr(yoys)}</td>
    </tr>`;
  });
  h+=`</tbody></table></div></div>`;

  // 카테고리 상세 테이블 (W25 집중)
  h+=`<div class="card"><div class="card-hd">
    <span class="card-title">📋 카테고리 상세 (${NW}) — ${titleLbl}</span><span class="card-hint">비중 변화 포함</span></div>
    <div class="tbl-scroll" style="max-height:420px"><table class="tbl"><thead><tr>
      <th>#</th><th>카테고리</th>
      <th class="r">2026 ${NW}</th><th class="r">2025 ${NW}</th><th class="r">증감</th>
      <th class="c">YoY</th><th class="c">26 비중</th><th class="c">25 비중</th><th class="c">비중 Δ</th>
    </tr></thead><tbody>`;
  (dCat||[]).filter(c=>c.amt26>0).forEach((c,i)=>{
    const chg=c.amt26-c.amt25, pp=+(c.pct26-c.pct25).toFixed(1);
    const col=CC[c.cat]||'#94a3b8';
    h+=`<tr><td style="color:var(--muted);font-family:'DM Mono',monospace">${i+1}</td>
      <td><span class="cp" style="background:${col}22;color:${col};border:1px solid ${col}44">${c.cat}</span></td>
      <td class="mono">${fA(c.amt26)}</td><td class="mono" style="color:var(--muted)">${fA(c.amt25)}</td>
      <td class="mono ${chg>=0?'up':'dn'}">${fC(chg)}</td>
      <td class="cen">${yB(c.yoy)}</td>
      <td class="mono">${c.pct26}%</td><td class="mono" style="color:var(--muted)">${c.pct25}%</td>
      <td class="cen"><span class="yoy ${pp>0?'ym':pp<0?'yw':'yn'}">${pp>0?'+':''}${pp}pp</span></td>
    </tr>`;
  });
  h+=`</tbody></table></div></div>`;
  return h;
}

// ════════════════════════════════════════════
// VIEW 3: 매장별 상세
// ════════════════════════════════════════════
function buildAlertCard(br,info){
  const yoys=WEEKS.map(w=>info.week_yoys?.[w]||0);
  const wks=WEEKS.map(wk=>`<div class="acw">
    <div class="acw-lbl">${wk}</div>
    <div class="acw-yoy" style="color:${(info.week_yoys?.[wk]||0)>=0?'var(--up)':'var(--down)'}">${fP(info.week_yoys?.[wk]||0)}</div>
    <div class="acw-amt">${fA(info.week_26?.[wk]||0)}</div>
  </div>`).join('');
  const sigs=(info.signals||[]).map(s=>`<span class="acsig ${s.includes('WoW')?'wow':''}">${s==='YoY_지속부진'?'YoY↓지속':s==='YoY_2연속_부진'?'2주↓YoY':s==='YoY_급락'?'급락🚨':'WoW↓'}</span>`).join('');
  return`<div class="ac ${info.severity}" style="margin:0">
    <div class="ac-hd"><div>
      <div class="ac-name">${br} <span style="font-size:11px;color:var(--muted);font-weight:400">(${info.region}/${info.st})</span></div>
      <div class="ac-sub">${ZONES[info.region]||''} · ${NW}: ${fA(info.week_26?.[NW]||0)}</div>
    </div><span class="ac-sev ${info.severity}">${info.severity.toUpperCase()}</span></div>
    <div class="ac-sigs">${sigs}</div>
    <div class="ac-weeks">${wks}</div>
  </div>`;
}

function renderBranch(d){
  const brs=[...(d.byBranch||[])].filter(b=>b.amt26>0);
  // 매장별 3주 추이
  const regionBrs=Object.entries(M.branches||{})
    .filter(([,b])=>curR==='전국'||b.region===curR)
    .map(([br,b])=>{
      const amts=WEEKS.map(w=>b.weeks[w]?.amt26||0);
      const yoys=WEEKS.map(w=>b.weeks[w]?.yoy||0);
      return{br,st:b.st,region:b.region,amts,yoys,
             sev:AL[br]?.severity||null};
    })
    .filter(b=>Math.max(...b.amts)>3000)
    .sort((a,b)=>b.amts[2]-a.amts[2]);

  const highCnt=regionBrs.filter(b=>b.sev==='high').length;
  const medCnt=regionBrs.filter(b=>b.sev==='medium').length;

  let h=`<div class="g3" style="margin-bottom:14px">
    <div class="kpi" style="border-color:#fca5a5;background:#fef2f2">
      <div class="kpi-lbl">🚨 HIGH</div><div class="kpi-val" style="color:#dc2626">${highCnt}개 매장</div>
      <div class="kpi-s">즉시 점검 필요 · 아래 표에서 클릭하면 상세</div></div>
    <div class="kpi" style="border-color:#fde68a;background:#fffbeb">
      <div class="kpi-lbl">⚠️ MEDIUM</div><div class="kpi-val" style="color:#d97706">${medCnt}개 매장</div>
      <div class="kpi-s">지속 모니터링</div></div>
    <div class="kpi">
      <div class="kpi-lbl">감지 기준</div>
      <div class="kpi-val" style="font-size:12px;line-height:1.6">공통: 2주 연속 &lt;-5%<br>HIGH: 최저치 &lt;-12%<br>MED: 최저치 -5~-12%</div></div>
  </div>`;

  h+=`<div class="card"><div class="card-hd">
    <span class="card-title">🏪 매장별 3주 추이</span><span class="card-hint">${regionBrs.length}개 매장 · ⚠️ 클릭 시 상세 펼침</span></div>
    <div class="tbl-scroll" style="max-height:560px;overflow-x:auto"><table class="tbl"><thead><tr>
      <th>매장</th>${curR==='전국'?'<th>지역</th>':''}<th>ST</th>
      <th class="r">W26</th><th class="c">YoY</th>
      <th class="r">W27</th><th class="c">YoY</th>
      <th class="r">W28</th><th class="c">YoY</th>
      <th class="c">WoW↗</th><th class="c">추세</th>
      <th class="c">GP%(${NW})</th><th class="c">SKU/등급</th><th class="c">⚠️</th>
    </tr></thead><tbody>`;

  regionBrs.forEach(b=>{
    const wows=b.amts[1]>0?+((b.amts[2]-b.amts[1])/b.amts[1]*100).toFixed(1):0;
    const clickable=b.sev?`onclick="toggleBranchAlert('${b.br}')" style="cursor:pointer"`:'';
    const atag=b.sev==='high'?`<span style="font-size:9px;background:#ef4444;color:#fff;padding:1px 5px;border-radius:3px;font-weight:700">H</span>`:b.sev==='medium'?`<span style="font-size:9px;background:#f59e0b;color:#fff;padding:1px 5px;border-radius:3px;font-weight:700">M</span>`:'';
    const g27=(GP.branches[b.br]||{})[NW]||{};
    const gpCell=g27.gp_pct!==null&&g27.gp_pct!==undefined?`${g27.gp_pct}%${g27.verified?' <span style="color:#15803d;font-size:10px">✅</span>':''}`:'<span style="color:var(--muted)">-</span>';
    const skuCell=g27.sku?`${g27.sku} <span class="cp" style="font-size:9.5px;background:${g27.sku_tier==='대형'?'#dbeafe':g27.sku_tier==='중형'?'#dcfce7':'#fef3c7'};color:${g27.sku_tier==='대형'?'#1d4ed8':g27.sku_tier==='중형'?'#15803d':'#a16207'}">${g27.sku_tier}</span>`:'<span style="color:var(--muted)">-</span>';
    h+=`<tr style="${b.sev==='high'?'background:#fef2f2':b.sev==='medium'?'background:#fffbeb':''}${b.sev?';cursor:pointer':''}" ${b.sev?`onclick="toggleBranchAlert('${b.br}')"`:''}>
      <td><strong>${b.br}</strong></td>${curR==='전국'?`<td style="color:var(--muted)">${b.region}</td>`:''}
      <td style="color:var(--muted)">${b.st}</td>
      <td class="mono">${fA(b.amts[0])}</td><td class="cen">${yB(b.yoys[0])}</td>
      <td class="mono">${fA(b.amts[1])}</td><td class="cen">${yB(b.yoys[1])}</td>
      <td class="mono">${fA(b.amts[2])}</td><td class="cen">${yB(b.yoys[2])}</td>
      <td class="cen">${yB(wows)}</td>
      <td class="cen" style="font-size:16px">${arr(b.yoys)}</td>
      <td class="cen mono">${gpCell}</td>
      <td class="cen">${skuCell}</td>
      <td class="cen" ${clickable}>${atag}${b.sev?` ${expandedBr===b.br?'▲':'▼'}`:''}</td>
    </tr>`;
    if(expandedBr===b.br && AL[b.br]){
      const colspan=curR==='전국'?13:12;
      h+=`<tr><td colspan="${colspan}" style="padding:10px 14px;background:#f8fafc">
        ${buildAlertCard(b.br,AL[b.br])}
      </td></tr>`;
    }
  });
  h+=`</tbody></table></div></div>`;
  return h;
}

// ════════════════════════════════════════════
// VIEW 4: 드릴다운 (좁고 깊게)
// ════════════════════════════════════════════
function renderDeep(d){
  const bdet=DX.branch_detail||{};
  const alertBrs=Object.keys(AL).filter(br=>curR==='전국'||AL[br].region===curR);
  let h='';

  if(alertBrs.length===0){
    return`<div style="padding:60px;text-align:center;color:var(--muted);font-size:14px">✅ ${curR==='전국'?'전국':curR}에서 드릴다운 대상 매장이 없습니다.</div>`;
  }

  h+=`<div style="margin-bottom:8px;font-size:12px;color:var(--dim);font-weight:600">
    🔬 이상 징후 매장의 카테고리·PLU 드릴다운 — ${alertBrs.length}개 매장</div>`;

  alertBrs.forEach(br=>{
    const info=AL[br]; const det=bdet[br];
    if(!det)return;
    const sev=info.severity;

    h+=`<div class="card" style="margin-bottom:12px">
      <div class="card-hd" style="${sev==='high'?'background:#fef2f2':'background:#fffbeb'}">
        <div>
          <span class="card-title">${br} <span style="font-size:10px;background:${sev==='high'?'#ef4444':'#f59e0b'};color:#fff;padding:2px 7px;border-radius:3px;font-weight:700;margin-left:6px">${sev.toUpperCase()}</span></span>
          <span style="font-size:11px;color:var(--muted);margin-left:10px">${info.region} · ${info.st} · ${NW}: ${fA(det.total26)} (YoY ${fP(det.yoy)})</span>
        </div>
        <div style="display:flex;gap:4px">${(info.signals||[]).map(s=>`<span class="acsig">${s==='YoY_지속부진'?'YoY↓지속':s==='YoY_2연속_부진'?'2주↓YoY':s==='YoY_급락'?'급락🚨':'WoW↓'}</span>`).join('')}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border)">
        <!-- 카테고리 드릴다운 -->
        <div style="border-right:1px solid var(--border)">
          <div style="padding:8px 12px;font-size:11px;font-weight:700;color:var(--dim);background:#f8fafc;border-bottom:1px solid var(--border)">카테고리별 ${NW} YoY <span style="font-weight:400;color:var(--muted)">(분류 커버리지 ~97%, 미분류 포함)</span></div>
          <div class="tbl-scroll" style="max-height:220px"><table class="tbl"><thead><tr>
            <th>카테고리</th><th class="r">2026</th><th class="r">2025</th><th class="c">YoY</th>
          </tr></thead><tbody>`;
    (det.byCat||[]).filter(c=>c.amt26>0||c.amt25>0).sort((a,b)=>b.amt26-a.amt26).forEach(c=>{
      const col=CC[c.cat]||'#94a3b8';
      h+=`<tr><td><span class="cp" style="background:${col}22;color:${col};border:1px solid ${col}44">${c.cat}</span></td>
        <td class="mono">${fA(c.amt26)}</td><td class="mono" style="color:var(--muted)">${fA(c.amt25)}</td>
        <td class="cen">${yB(c.yoy)}</td></tr>`;
    });
    h+=`</tbody></table></div></div>
        <!-- Top 15 PLU -->
        <div>
          <div style="padding:8px 12px;font-size:11px;font-weight:700;color:var(--dim);background:#f8fafc;border-bottom:1px solid var(--border)">Top 15 PLU ${NW} YoY <span style="font-weight:400;color:#15803d">✅ 실측</span></div>
          <div class="tbl-scroll" style="max-height:220px"><table class="tbl"><thead><tr>
            <th>PLU</th><th>품목</th><th class="r">2026</th><th class="r">2025</th><th class="c">YoY</th>
          </tr></thead><tbody>`;
    (det.topItems||[]).forEach(it=>{
      const kr=it.kr&&it.kr!=='nan'?it.kr:(it.eng||'');
      h+=`<tr><td><span class="plu">${it.code}</span></td>
        <td>${kr.length>18?kr.slice(0,18)+'…':kr}</td>
        <td class="mono">${fA(it.amt26)}</td>
        <td class="mono" style="color:var(--muted)">${fA(it.amt25)}</td>
        <td class="cen">${it.amt25>0?yB(it.yoy):'<span class="yoy ym">NEW</span>'}</td></tr>`;
    });
    h+=`</tbody></table></div></div>
      </div>
    </div>`;
  });
  return h;
}

// VIEW 5: PLU 이동·가격 변화
// ════════════════════════════════════════════
function renderPLU(){
  const gone=DX.gone_plu||[];
  const newP=DX.new_plu||[];
  // $ 임팩트(W25 매출) 기준으로 재정렬 — %보다 실제 매출 규모가 큰 것부터 우선 노출
  const pUp=[...(DX.price_up||[])].sort((a,b)=>(b.a26||0)-(a.a26||0));
  const pDn=[...(DX.price_down||[])].sort((a,b)=>(b.a26||0)-(a.a26||0));

  let h=`<div class="g2">`;
  // 소멸 PLU
  h+=`<div class="card"><div class="card-hd">
    <span class="card-title">📤 소멸 PLU Top 20</span>
    <span class="card-hint">2025 있었으나 2026 ${NW} 없음</span></div>
    <div class="tbl-scroll" style="max-height:380px"><table class="tbl"><thead><tr>
      <th>PLU</th><th>품목명</th><th>카테고리</th><th class="r">2025 매출</th><th class="c">매장수</th>
    </tr></thead><tbody>`;
  gone.forEach(r=>{
    const kr=r['Item Description']||''; const eg=r['Eng Description']||'';
    const col=CC[r['CAT']]||'#94a3b8';
    h+=`<tr><td><span class="plu">${r['Item Code']}</span></td>
      <td><div style="font-size:11px;font-weight:500">${kr.length>20?kr.slice(0,20)+'…':kr}</div>${eg?`<div style="font-size:10px;color:var(--muted)">${eg.length>20?eg.slice(0,20)+'…':eg}</div>`:''}</td>
      <td><span class="cp" style="background:${col}22;color:${col};border:1px solid ${col}44">${r['CAT']}</span></td>
      <td class="mono">${fA(r['Amt'])}</td><td class="cen" style="font-family:'DM Mono',monospace">${r['Stores']}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;

  // 신규 PLU
  h+=`<div class="card"><div class="card-hd">
    <span class="card-title">📥 신규 PLU Top 20</span>
    <span class="card-hint">2026 ${NW} 새로 등장</span></div>
    <div class="tbl-scroll" style="max-height:380px"><table class="tbl"><thead><tr>
      <th>PLU</th><th>품목명</th><th>카테고리</th><th class="r">2026 매출</th><th class="c">매장수</th>
    </tr></thead><tbody>`;
  newP.forEach(r=>{
    const kr=r['Item Description']||''; const eg=r['Eng Description']||'';
    const col=CC[r['CAT']]||'#94a3b8';
    h+=`<tr><td><span class="plu">${r['Item Code']}</span></td>
      <td><div style="font-size:11px;font-weight:500">${kr.length>20?kr.slice(0,20)+'…':kr}</div>${eg?`<div style="font-size:10px;color:var(--muted)">${eg.length>20?eg.slice(0,20)+'…':eg}</div>`:''}</td>
      <td><span class="cp" style="background:${col}22;color:${col};border:1px solid ${col}44">${r['CAT']}</span></td>
      <td class="mono">${fA(r['Amt'])}</td><td class="cen" style="font-family:'DM Mono',monospace">${r['Stores']}</td></tr>`;
  });
  h+=`</tbody></table></div></div></div>`;

  // 가격 × 판매량 교차표 — 전국/지역/매장 스코프 대응
  const PQ = DX.price_qty_matrix || {national:{summary:{},items:[]}, regions:{}, branches:{}};
  const brInRegion = Object.entries(M.branches||{}).filter(([,b])=>curR==='전국'||b.region===curR).map(([br])=>br).sort();
  const validSelBr = pluSelBr && brInRegion.includes(pluSelBr) && PQ.branches[pluSelBr];
  let pqm, scopeLabel;
  if(validSelBr){
    pqm = PQ.branches[pluSelBr]; scopeLabel = pluSelBr+' 매장';
  } else if(curR==='전국'){
    pqm = PQ.national; scopeLabel='전국';
  } else {
    pqm = PQ.regions[curR] || {summary:{}, items:[]}; scopeLabel = curR+' 지역';
  }
  const QDEF = {
    premium_ok:{label:'프리미엄 성공', desc:'가격↑ · 판매량↑', color:'#15803d', bg:'#f0fdf4', action:'진열 확대·전면 배치'},
    resistance:{label:'가격 저항', desc:'가격↑ · 판매량↓', color:'#b91c1c', bg:'#fef2f2', action:'진열·가격 재점검'},
    promo_ok:{label:'프로모션 효과', desc:'가격↓ · 판매량↑', color:'#1d4ed8', bg:'#eff6ff', action:'프로모션 패턴 벤치마킹'},
    demand_loss:{label:'수요 이탈', desc:'가격↓ · 판매량↓', color:'#92400e', bg:'#fffbeb', action:'품질·발주 재검토'},
    flat:{label:'변동 미미', desc:'±2% 이내', color:'#64748b', bg:'#f8fafc', action:'모니터링만'}
  };
  h+=`<div class="card" style="margin-bottom:14px"><div class="card-hd">
    <span class="card-title">💹 가격 × 판매량 교차표 — ${scopeLabel} ${NW}</span>
    <span class="card-hint">SPI(단가) 변화의 원인을 품목 단위로 분해 · 매출($) 순 정렬</span></div>
    <div style="padding:10px 14px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <label style="font-size:11.5px;color:var(--muted)">매장 보기:</label>
      <select onchange="pluSelBr=this.value||null;render()" style="padding:5px 9px;border-radius:6px;border:1px solid #ddd;font-size:12.5px">
        <option value="" ${!validSelBr?'selected':''}>전체 (${curR==='전국'?'전국':curR+' 지역'} 합계)</option>
        ${brInRegion.map(br=>`<option value="${br}" ${pluSelBr===br?'selected':''}>${br}</option>`).join('')}
      </select>
    </div>
    <div style="padding:10px 14px 4px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
    ${['premium_ok','resistance','promo_ok','demand_loss'].map(k=>{
      const q=QDEF[k]; const s=pqm.summary[k]||{cnt:0,amt:0};
      return `<div style="border:1px solid ${q.color}33;background:${q.bg};border-radius:8px;padding:8px 10px">
        <div style="font-size:11px;font-weight:700;color:${q.color}">${q.label}</div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px">${q.desc}</div>
        <div style="font-size:15px;font-weight:700;color:${q.color}">${s.cnt}개</div>
        <div style="font-size:10.5px;color:var(--muted)">${fA(s.amt)}</div>
      </div>`;
    }).join('')}
    </div>
    <div style="padding:8px 14px 0;font-size:11px;color:var(--muted)">${(()=>{
      const entries=['premium_ok','resistance','promo_ok','demand_loss'].map(k=>[k,(pqm.summary[k]||{amt:0}).amt]);
      entries.sort((a,b)=>b[1]-a[1]);
      const top=entries[0];
      if(!top||top[1]<=0) return '💡 이 스코프에서는 유의미한 가격·판매량 변동이 크지 않습니다.';
      const q=QDEF[top[0]];
      return `💡 <strong style="color:${q.color}">${q.label}</strong> 품목이 매출 규모가 가장 큽니다 (${fA(top[1])}) — ${q.desc} 패턴이 이 스코프의 SPI 변화를 주도하고 있어 우선 점검 대상입니다.`;
    })()}</div>
    <div class="tbl-scroll" style="max-height:460px;margin-top:8px"><table class="tbl"><thead><tr>
      <th>품목</th><th>카테고리</th><th class="r">2025 단가</th><th class="r">2026 단가</th>
      <th class="c">가격변화</th><th class="c">판매량변화</th><th class="r">매출($)</th><th class="c">사분면</th><th>권장 액션</th>
    </tr></thead><tbody>`;
  if(!(pqm.items||[]).length){
    h+=`<tr><td colspan="9" style="padding:40px;text-align:center;color:var(--muted)">이 스코프에는 비교 가능한 품목 데이터가 부족합니다 (전년 동기 데이터 없음 등).</td></tr>`;
  }
  (pqm.items||[]).forEach(it=>{
    const q=QDEF[it.quadrant]||QDEF.flat;
    const kr=(it.kr||it.eng||'').toString();
    const col=CC[it.cat]||'#94a3b8';
    h+=`<tr>
      <td><div style="font-weight:600;font-size:11.5px">${kr.length>16?kr.slice(0,16)+'…':kr}</div><div style="font-size:10px;color:var(--muted)">${it.code}</div></td>
      <td><span class="cp" style="background:${col}22;color:${col};border:1px solid ${col}44;font-size:10px">${it.cat}</span></td>
      <td class="mono r" style="color:var(--muted)">$${it.u25.toFixed(2)}</td>
      <td class="mono r">$${it.u26.toFixed(2)}</td>
      <td class="cen">${yB(it.price_chg)}</td>
      <td class="cen">${yB(it.qty_chg)}</td>
      <td class="mono r">${fA(it.amt26)}</td>
      <td class="cen"><span class="cp" style="background:${q.color}22;color:${q.color};border:1px solid ${q.color}44;font-size:10px;font-weight:700">${q.label}</span></td>
      <td style="font-size:10.5px;color:${q.color}">${q.action}</td>
    </tr>`;
  });
  h+=`</tbody></table></div></div>`;
  return h;
}

function renderGP(d){
  const lbl=curR==='전국'?'전국':curR;
  const isTX=curR==='TX';

  const allRegionGP=REGIONS.map(r=>({r,gp:(GP.regions[r]||{})[NW]?.gp_pct, verified:(GP.regions[r]||{})[NW]?.verified}));
  const suspicious=allRegionGP.filter(x=>x.gp!==undefined&&x.gp!==null&&x.gp>50&&!x.verified);
  let h='';
  if(isTX){
    h+=`<div class="abanner" style="background:#f0fdf4;border-color:#86efac">
      <span style="font-size:22px">✅</span>
      <div><h3 style="color:#15803d">TX GP% — ${GP.weeks4[0]}~${NW} 전 주차 실제 GP 리포트 반영 완료</h3>
      <p>매입 데이터 기반 추정치를 4주 전부 실제 GP 리포트 수치로 교체했습니다. 아래 매장별 GP% 4주 추이 표에서 ✅ 표시가 실측 데이터입니다.
      급격한 변화(예: 한 주 사이 GP%가 두 배 가까이 뛰거나 떨어지는 경우)가 보이면 매입 단가·판매 믹스·일시적 프로모션 여부를 확인해보시면 좋습니다.</p></div></div>`;
  }
  if(suspicious.length>0){
    h+=`<div class="abanner" style="background:#fff7ed;border-color:#fdba74">
      <span style="font-size:22px">⚠️</span>
      <div><h3 style="color:#c2410c">GP% 데이터 정합성 주의 (추정치 구간)</h3>
      <p>${suspicious.map(x=>`${x.r}(${x.gp}%)`).join(', ')} 지역의 GP%가 다른 지역(평균 20~40%대)보다 비정상적으로 높습니다.
      DC/창고를 통한 매입이 매장 매입 데이터에 잡히지 않아 비용이 과소 집계됐을 가능성이 있습니다(TX와 동일한 원인으로 확인됨).
      실제 마진으로 단정하지 말고 SCM/매입팀에 데이터 확인을 먼저 권장합니다.</p></div></div>`;
  }

  const g=w=>curR==='전국'?GP.national[w]:(GP.regions[curR]||{})[w]||{};
  const w26=g(NW), w25=g(GP.weeks4[2]);
  const gpDir=(w26.gp_pct||0)>=(w25.gp_pct||0)?'up':'dn';
  h+=`<div class="kpi-row">
    <div class="kpi"><div class="kpi-lbl">${NW} GP%${w26.verified?' <span style="color:#15803d;font-size:11px">✅실측</span>':''}</div>
      <div class="kpi-val" style="color:#7c3aed">${w26.gp_pct??'-'}%</div>
      <div class="kpi-d ${gpDir}">전주(${GP.weeks4[2]}) ${w25.gp_pct??'-'}% 대비 ${gpDir==='up'?'+':''}${w26.gp_pct!==null&&w25.gp_pct!==null?(w26.gp_pct-w25.gp_pct).toFixed(1):'-'}pp</div></div>
    <div class="kpi"><div class="kpi-lbl">${NW} GP$</div>
      <div class="kpi-val">${fA(w26.gp||0)}</div>
      <div class="kpi-s">매출 ${fA(w26.sales||0)} − 매입 ${fA(w26.purchase||0)}</div></div>
    <div class="kpi"><div class="kpi-lbl">SKU (${NW})</div>
      <div class="kpi-val">${(skuInfo().avg_per_store||0).toLocaleString()}</div>
      <div class="kpi-s">매장당 평균 · 전체 ${(skuInfo().total_distinct||0).toLocaleString()}종</div></div>
    <div class="kpi" style="border-color:#c4b5fd;background:#f5f3ff">
      <div class="kpi-lbl">📉 GP% 이상 징후</div>
      <div class="kpi-val" style="color:#6d28d9">${Object.keys(GP.alerts).filter(br=>curR==='전국'||(M.branches[br]||{}).region===curR).length}개 매장</div>
      <div class="kpi-s">전주 대비 2주+ 연속 하락</div></div>
  </div>`;

  const brs=(d.byBranch||[]).map(b=>b.br);
  h+=`<div class="card" style="margin-bottom:14px"><div class="card-hd">
    <span class="card-title">📦 매장별 GP% 4주 추이 — ${lbl}</span><span class="card-hint">${isTX?(GP.weeks4[0]+'~'+NW+' 전부 실제 GP 리포트'):'매입 데이터 기준 (전주 대비 WoW) · SKU/매출은 매장별 현황 탭 참고'}</span></div>
    <div class="tbl-scroll" style="max-height:380px"><table class="tbl"><thead><tr>
    <th>매장</th>${GP.weeks4.map(w=>`<th class="r">${w}</th>`).join('')}
    <th class="c">⚠️</th>
    </tr></thead><tbody>`;
  brs.forEach(br=>{
    const bg=GP.branches[br]||{};
    const pcts=GP.weeks4.map(w=>(bg[w]||{}).gp_pct);
    const verifs=GP.weeks4.map(w=>(bg[w]||{}).verified);
    const hasAlert=!!GP.alerts[br];
    h+=`<tr ${hasAlert?'style="background:#faf5ff"':''}><td><strong>${br}</strong></td>
      ${pcts.map((p,i)=>`<td class="mono r">${p!==null&&p!==undefined?p+'%':'-'}${verifs[i]?' ✅':''}</td>`).join('')}
      <td class="cen">${hasAlert?'📉':''}</td>
    </tr>`;
  });
  h+=`</tbody></table></div></div>`;

  const prevWk=GP.weeks4[GP.weeks4.length-2];
  const skuRows=brs.map(br=>{
    const cur=(GP.branches[br]||{})[NW]||{};
    const prev=(GP.branches[br]||{})[prevWk]||{};
    const delta=(cur.sku!=null&&prev.sku!=null)?cur.sku-prev.sku:null;
    return {br,sku:cur.sku,tier:cur.sku_tier,delta};
  }).sort((a,b)=>(b.sku??-1)-(a.sku??-1));
  h+=`<div class="card" style="margin-bottom:14px"><div class="card-hd">
    <span class="card-title">🔢 매장별 SKU 현황 — ${lbl}</span><span class="card-hint">${NW} 기준 · 전주(${prevWk}) 대비 증감</span></div>
    <div class="tbl-scroll" style="max-height:380px"><table class="tbl"><thead><tr>
    <th>매장</th><th class="r">SKU(${NW})</th><th class="c">규모</th><th class="r">전주 대비</th>
    </tr></thead><tbody>`;
  skuRows.forEach(r=>{
    const dCls=r.delta>0?'up':r.delta<0?'down':'';
    h+=`<tr><td><strong>${r.br}</strong></td>
      <td class="mono r">${r.sku??'-'}</td>
      <td class="cen">${r.tier?`<span class="cp">${r.tier}</span>`:'-'}</td>
      <td class="mono r ${dCls}">${r.delta!=null?(r.delta>0?'+':'')+r.delta:'-'}</td>
    </tr>`;
  });
  h+=`</tbody></table></div></div>`;

  const gpAlertList=Object.entries(GP.alerts).filter(([br])=>curR==='전국'||(M.branches[br]||{}).region===curR);
  if(gpAlertList.length>0){
    h+=`<div class="card" style="margin-bottom:14px;border-color:#c4b5fd"><div class="card-hd">
      <span class="card-title">📉 GP% 2주+ 연속 하락 매장</span><span class="card-hint">${gpAlertList.length}개</span></div>
      <div class="ac-grid">`;
    gpAlertList.forEach(([br,a])=>{
      h+=`<div class="acard" style="border-color:#c4b5fd"><div class="ac-hd">
        <strong>${br}</strong><span class="cp" style="background:#ede9fe;color:#6d28d9">-${a.total_drop_pp}pp</span></div>
        <div class="ac-body">${a.weeks.join(' → ')}<br>GP% ${a.gp_pcts.join('% → ')}%</div></div>`;
    });
    h+=`</div></div>`;
  }

  const brsWithData=brs.filter(br=>(GP.cat26_tx&&GP.cat26_tx[br])||(DX.branch_detail&&DX.branch_detail[br]));
  const hasDeepDive=curR!=='전국'&&brsWithData.length>0;
  if(hasDeepDive){
    h+=`<div class="card" style="margin-bottom:14px"><div class="card-hd">
      <span class="card-title">🏷️ ${lbl} 매장별 카테고리 구성 (${NW})</span>
      <span class="card-hint">매장 선택 →</span></div>
      <div style="padding:10px 14px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <select id="gpBrSel" onchange="gpSelBr=this.value;render()" style="padding:6px 10px;border-radius:6px;border:1px solid #ddd;font-size:13px">
        ${brsWithData.map(br=>`<option value="${br}" ${gpSelBr===br?'selected':''}>${br}</option>`).join('')}
      </select>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;user-select:none">
        <input type="checkbox" id="gpCnChk" ${gpCnOnly?'checked':''} onchange="gpCnOnly=this.checked;render()">
        🇨🇳 중국채소만 보기
      </label></div>`;
    const selBr=gpSelBr&&brsWithData.includes(gpSelBr)?gpSelBr:brsWithData[0];
    const hasYoy=!!(DX.branch_detail&&DX.branch_detail[selBr]);

    if(gpCnOnly){
      const cn=(GP.cnveg_tx&&GP.cnveg_tx[selBr])||{items:[],total:0,pct_of_store:0};
      h+=`<div style="padding:10px 14px;font-size:12px;color:var(--muted)">
        ${selBr} 중국채소 매출 <strong style="color:#0f766e">${fA(cn.total)}</strong> (매장 전체의 ${cn.pct_of_store}%) · ${cn.items.length}개 품목<br>
        <span style="font-size:11px">※ 식물학적 15개 카테고리는 그대로 유지하고, "중국채소"는 보조 태그로 교차 필터링한 결과입니다.</span>
      </div>
      <div class="tbl-scroll" style="max-height:380px;padding:0 14px 14px"><table class="tbl"><thead><tr>
      <th>품목</th><th>카테고리</th><th class="r">매출(${NW})</th></tr></thead><tbody>`;
      cn.items.forEach(it=>{
        const col=CC[it.cat]||'#94a3b8';
        h+=`<tr><td><div style="font-weight:600">${it.kr||it.eng||it.code}</div><div style="font-size:10.5px;color:var(--muted)">${it.eng&&it.kr?it.eng:''} · ${it.code}</div></td>
          <td><span class="cp" style="background:${col}22;color:${col};border:1px solid ${col}44;font-size:10.5px">${it.cat}</span></td>
          <td class="mono r">${fA(it.amt)}</td></tr>`;
      });
      h+=`</tbody></table></div></div>`;
    } else if(hasYoy){
      const bd=DX.branch_detail[selBr];
      h+=`<div style="padding:10px 14px;font-size:12px;color:var(--muted)">
        ${selBr} 카테고리별 전년 대비(YoY) 포함 상세입니다. 작년 동주 판매 데이터가 반영되어 있습니다.
      </div>
      <div class="tbl-scroll" style="max-height:340px;padding:0 14px 14px"><table class="tbl"><thead><tr>
        <th>카테고리</th><th class="r">매출(${NW})</th><th class="r">작년 동주</th><th class="c">YoY</th><th class="r">비중</th></tr></thead><tbody>`;
      (bd.byCat||[]).forEach(c=>{
        const col=CC[c.cat]||'#94a3b8';
        h+=`<tr><td><span class="cp" style="background:${col}22;color:${col};border:1px solid ${col}44">${c.cat}</span></td>
          <td class="mono r">${fA(c.amt26)}</td><td class="mono r" style="color:var(--muted)">${fA(c.amt25)}</td>
          <td class="cen">${yB(c.yoy)}</td><td class="mono r">${c.pct26}%</td></tr>`;
      });
      h+=`</tbody></table></div></div>`;
    } else {
      const cd=(GP.cat26_tx&&GP.cat26_tx[selBr])||{byCat:[],total:0};
      const misRow=cd.byCat.find(c=>c.cat==='미분류');
      h+=`<div style="padding:10px 14px;font-size:12px;color:var(--muted)">
        ${misRow&&misRow.pct>5?`⚠️ 이 매장 매출의 <strong style="color:#c2410c">${misRow.pct}%</strong>는 카테고리 매칭이 안 되어 "미분류"로 표시됩니다.`:(misRow?`카테고리 매칭률 ${(100-misRow.pct).toFixed(1)}% (미분류 ${misRow.pct}% — 키워드 기반 자동 분류 적용됨)`:'카테고리 매칭률 100%')}
        <br><span style="font-size:11px">작년 동주 데이터를 생성기에 함께 올리면 이 표에 YoY(전년 대비) 열이 추가됩니다.</span>
      </div>
      <div class="tbl-scroll" style="max-height:320px;padding:0 14px 14px"><table class="tbl"><thead><tr>
        <th>카테고리</th><th class="r">매출(${NW})</th><th class="r">비중</th></tr></thead><tbody>`;
      cd.byCat.forEach(c=>{
        const col=CC[c.cat]||'#94a3b8';
        h+=`<tr><td><span class="cp" style="background:${col}22;color:${col};border:1px solid ${col}44">${c.cat}</span></td>
          <td class="mono r">${fA(c.amt)}</td><td class="mono r">${c.pct}%</td></tr>`;
      });
      h+=`</tbody></table></div></div>`;
    }

    const under=((GP.underperform_tx&&GP.underperform_tx[selBr])||[]).slice(0,40);
    const underByCat={};
    under.forEach(it=>{ (underByCat[it.cat]=underByCat[it.cat]||[]).push(it); });
    const catOrder=Object.keys(underByCat).sort((a,b)=>underByCat[b].length-underByCat[a].length);
    h+=`<div class="card"><div class="card-hd">
      <span class="card-title">🔻 ${selBr} — ${lbl} 지역 평균 대비 저조 아이템</span>
      <span class="card-hint">매장 판매액 &lt; 지역평균의 50% · 카테고리별 그룹</span></div>
      <div class="tbl-scroll" style="max-height:480px"><table class="tbl"><thead><tr>
      <th>품목</th><th class="r">${selBr} 매출</th><th class="r">${lbl} 평균</th><th class="r">격차</th>
      </tr></thead><tbody>`;
    if(catOrder.length===0){
      h+=`<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px">저조 아이템이 없습니다.</td></tr>`;
    }
    catOrder.forEach(cat=>{
      const col=CC[cat]||'#94a3b8';
      const items=underByCat[cat];
      h+=`<tr style="background:${col}0f"><td colspan="4" style="padding:6px 10px">
        <span class="cp" style="background:${col}22;color:${col};border:1px solid ${col}44">${cat}</span>
        <span style="font-size:11px;color:var(--muted);margin-left:6px">${items.length}개 품목</span></td></tr>`;
      items.forEach(it=>{
        h+=`<tr><td><div style="font-weight:600">${it.kr||it.eng||it.code}</div><div style="font-size:10.5px;color:var(--muted)">${it.eng&&it.kr?it.eng:''} · ${it.code}</div></td>
          <td class="mono r">${fA(it.branch_amt)}</td><td class="mono r" style="color:var(--muted)">${fA(it.region_avg)}</td>
          <td class="mono r" style="color:var(--down)">${it.gap_pct}%</td></tr>`;
      });
    });
    h+=`</tbody></table></div></div>`;
  } else {
    h+=`<div class="card"><div class="card-hd"><span class="card-title">🏷️ 매장별 카테고리 구성 (${NW})</span></div>
      <div style="padding:20px 14px;color:var(--muted);font-size:13px">${curR==='전국'?'전국 탭에서는 매장별 상세를 지원하지 않습니다. 위의 지역 탭 중 하나를 선택하세요.':'이 지역은 아직 매장별 카테고리·저조 아이템 분석 데이터가 없습니다. TX GP Weekly Generator에서 전국 판매 데이터(xlsx)를 포함해 다시 생성하면 채워집니다.'}</div></div>`;
  }

  return h;
}

// ════════════════════════════════════════════
// MAIN RENDER
// ════════════════════════════════════════════
function render(){
  const d=M.regions[curR];
  if(!d){document.getElementById('mc').innerHTML='';return;}
  let h=buildAlertBanner(d)+buildStrip(d);
  if(curV==='macro')     h+=renderMacro(d);
  else if(curV==='category') h+=renderCategory(d);
  else if(curV==='branch')   h+=renderBranch(d);
  else if(curV==='deep')     h+=renderDeep(d);
  else if(curV==='plu')      h+=renderPLU();
  else if(curV==='gp')        h+=renderGP(d);
  document.getElementById('mc').innerHTML=h;
}

render();
</script>
</body>
</html>
